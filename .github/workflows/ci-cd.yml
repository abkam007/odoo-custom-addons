name: Odoo CI/CD

on:
  pull_request:
    branches:
      - "18.0"
      - "19.0"

  push:
    branches:
      - "18.0"
      - "19.0"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate custom addons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests and Python syntax
        run: python3 scripts/validate_odoo_addons.py

  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    needs:
      - validate

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/18.0' ||
       github.ref == 'refs/heads/19.0')

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Select deployment command
        id: target
        run: |
          case "$GITHUB_REF" in
            refs/heads/18.0)
              echo "command=/usr/local/sbin/deploy-odoo18" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/19.0)
              echo "command=/usr/local/sbin/deploy-odoo19" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.CONTABO_HOST }}
          DEPLOY_USER: ${{ secrets.CONTABO_USER }}
          DEPLOY_COMMAND: ${{ steps.target.outputs.command }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n $DEPLOY_COMMAND"
